---
openapi: 3.0.3
info:
  title: Сервис организаций
  version: 1.0.0
  description: |-
    Спецификация сервиса организаций. Данные передаются в XML.

    Валидация и ошибки:
    Неизвестные query-параметры и повторяющиеся параметры отклоняются с 400; массивы sort/filter передаются одним параметром с элементами через запятую. Параметры не приводятся молча к другому типу. Целочисленные поля требуют десятичных целых в объявленном диапазоне; дроби для них недопустимы. Для double разрешены конечные дробные значения. Пустые числовые значения, NaN и бесконечности недопустимы. Все ошибки 400/422 содержат location, field, code и message для каждого независимо обнаруженного нарушения. Отсутствующее обязательное тело и неразбираемый XML возвращают 400. Корректный XML с неверным корнем, неизвестными элементами, повторениями одиночных элементов, xsi:nil, генерируемыми/readOnly полями или нарушениями обязательности, типов и ограничений возвращает 422. XML использует корни и обёртки из схем. Имена непустые, но пробелы разрешены; пустые zipCode и имя town остаются допустимыми. Вложенные обязательные поля проверяются, только если соответствующий необязательный объект присутствует. Невалидный запрос отклоняется до изменений; ошибки после начала менеджерской последовательности могут оставить частичный результат. Ошибки имеют единый XML-формат Error; детали неполейных ошибок пусты. OpenAPI описывает обязательные проверки, но не реализует их: runtime-валидация выполняется backend-сервисами.
servers:
  - url: "{baseUrl}"
    description: Сервис организаций
    variables:
      baseUrl:
        default: http://localhost:8080
tags:
  - name: Организации
    description: Основные операции
  - name: Дополнительные операции
    description: Операции над коллекцией
  - name: Сотрудники
    description: Создание, чтение, изменение и удаление сотрудников
paths:
  "/organizations":
    post:
      tags:
        - Организации
      operationId: createOrganization
      summary: Добавить организацию
      description: Создаёт организацию с пустым списком employees.
      requestBody:
        "$ref": "#/components/requestBodies/CreateOrganizationInput"
      responses:
        '201':
          "$ref": "#/components/responses/OrganizationCreated"
        '400':
          description: "Неверные path/query-параметры, отсутствующее обязательное тело или неразбираемый XML. details указывает поля и причины. Нарушения полей синтаксически корректного XML возвращаются как 422."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                missingBody:
                  $ref: "#/components/examples/missingBody"
                malformedXml:
                  $ref: "#/components/examples/malformedXml"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        '422':
          "$ref": "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags:
        - Организации
      operationId: listOrganizations
      summary: Получить список организаций
      description: Условия filter объединяются через И. Поддерживаются диапазоны, поиск по части строки и несколько значений.
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
        - "$ref": "#/components/parameters/Filter"
      responses:
        '200':
          "$ref": "#/components/responses/OrganizationPage"
        '400':
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                unknownSortField:
                  $ref: "#/components/examples/unknownSortField"
                malformedSort:
                  $ref: "#/components/examples/malformedSort"
                emptySortTerm:
                  $ref: "#/components/examples/emptySortTerm"
                duplicateSort:
                  $ref: "#/components/examples/duplicateSort"
                conflictingSort:
                  $ref: "#/components/examples/conflictingSort"
                invalidPagination:
                  $ref: "#/components/examples/invalidPagination"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilter"
                malformedFilter:
                  $ref: "#/components/examples/malformedFilter"
                invalidFilterValue:
                  $ref: "#/components/examples/invalidFilterValue"
                repeatedSort:
                  $ref: "#/components/examples/repeatedSort"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/organizations/{id}":
    parameters:
      - "$ref": "#/components/parameters/OrganizationId"
    get:
      tags:
        - Организации
      operationId: getOrganization
      summary: Получить организацию по ID
      description: Возвращает организацию по её идентификатору.
      responses:
        '200':
          "$ref": "#/components/responses/OrganizationResult"
        "400":
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                invalid_id:
                  $ref: "#/components/examples/invalid_id"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
        - Организации
      operationId: updateOrganization
      summary: Изменить организацию
      description: Заменяет изменяемые поля организации. ID, creationDate и список employees сохраняются; принадлежность сотрудников меняется через API сотрудников.
      requestBody:
        "$ref": "#/components/requestBodies/UpdateOrganizationInput"
      responses:
        '200':
          "$ref": "#/components/responses/OrganizationResult"
        '400':
          description: "Неверные path/query-параметры, отсутствующее обязательное тело или неразбираемый XML. details указывает поля и причины. Нарушения полей синтаксически корректного XML возвращаются как 422."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                invalid_id:
                  $ref: "#/components/examples/invalid_id"
                missingBody:
                  $ref: "#/components/examples/missingBody"
                malformedXml:
                  $ref: "#/components/examples/malformedXml"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        '422':
          "$ref": "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Организации
      operationId: deleteOrganization
      summary: Удалить организацию
      description: Удаляет организацию по ID, только если employees пуст. Иначе возвращает 409 и сохраняет организацию и сотрудников. Проверка и удаление атомарны.
      responses:
        '204':
          description: Организация удалена
        "400":
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                invalid_id:
                  $ref: "#/components/examples/invalid_id"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        '409':
          "$ref": "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/employees":
    post:
      tags:
        - Сотрудники
      operationId: createEmployee
      summary: Добавить сотрудника
      description: Создаёт сотрудника с новым ID. organizationId необязателен; указанная организация должна существовать. Список employees организации обновляется автоматически.
      requestBody:
        "$ref": "#/components/requestBodies/EmployeeInput"
      responses:
        '201':
          "$ref": "#/components/responses/EmployeeCreated"
        '400':
          description: "Неверные path/query-параметры, отсутствующее обязательное тело или неразбираемый XML. details указывает поля и причины. Нарушения полей синтаксически корректного XML возвращаются как 422."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                missingBody:
                  $ref: "#/components/examples/missingBody2"
                malformedXml:
                  $ref: "#/components/examples/malformedXml"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        '422':
          $ref: "#/components/responses/EmployeeValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags:
        - Сотрудники
      operationId: listEmployees
      summary: Получить список сотрудников
      description: Возвращает страницу сотрудников. Для выбора сотрудников организации используйте filter=organizationId:eq:1. Для ненанятых сотрудников — filter=organizationId:isNull:true.
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/EmployeeSort"
        - "$ref": "#/components/parameters/EmployeeFilter"
      responses:
        '200':
          "$ref": "#/components/responses/EmployeePage"
        '400':
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                unknownSortField:
                  $ref: "#/components/examples/unknownSortField"
                malformedSort:
                  $ref: "#/components/examples/malformedSort"
                emptySortTerm:
                  $ref: "#/components/examples/emptySortTerm"
                duplicateSort:
                  $ref: "#/components/examples/duplicateSort"
                conflictingSort:
                  $ref: "#/components/examples/conflictingSort"
                invalidPagination:
                  $ref: "#/components/examples/invalidPagination"
                invalidFilter:
                  $ref: "#/components/examples/invalidFilter"
                malformedFilter:
                  $ref: "#/components/examples/malformedFilter"
                invalidFilterValue:
                  $ref: "#/components/examples/invalidFilterValue"
                repeatedSort:
                  $ref: "#/components/examples/repeatedSort"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/employees/{employeeId}":
    parameters:
      - "$ref": "#/components/parameters/EmployeeId"
    get:
      tags:
        - Сотрудники
      operationId: getEmployee
      summary: Получить сотрудника по ID
      description: Возвращает сотрудника и его текущую принадлежность организации.
      responses:
        '200':
          "$ref": "#/components/responses/EmployeeResult"
        '400':
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                invalid_employeeId:
                  $ref: "#/components/examples/invalid_employeeId"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
        - Сотрудники
      operationId: updateEmployee
      summary: Изменить сотрудника
      description: Заменяет имя и organizationId, сохраняя ID сотрудника. Перенос между организациями атомарно изменяет принадлежность и их списки employees. Отсутствующий organizationId снимает назначение. Организация назначения должна существовать. Отказ из-за ошибки валидации или отсутствующей организации назначения оставляет сотрудника неизменным. При 500/503 результат может быть неизвестен; перед повтором прочитайте сотрудника.
      requestBody:
        "$ref": "#/components/requestBodies/EmployeeInput"
      responses:
        '200':
          "$ref": "#/components/responses/EmployeeResult"
        '400':
          description: "Неверные path/query-параметры, отсутствующее обязательное тело или неразбираемый XML. details указывает поля и причины. Нарушения полей синтаксически корректного XML возвращаются как 422."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                invalid_employeeId:
                  $ref: "#/components/examples/invalid_employeeId"
                missingBody:
                  $ref: "#/components/examples/missingBody2"
                malformedXml:
                  $ref: "#/components/examples/malformedXml"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        '422':
          $ref: "#/components/responses/EmployeeValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Сотрудники
      operationId: deleteEmployee
      summary: Удалить сотрудника
      description: Удаляет сотрудника и исключает его из employees организации, если он был назначен.
      responses:
        '204':
          description: Сотрудник удалён
        '400':
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                invalid_employeeId:
                  $ref: "#/components/examples/invalid_employeeId"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/organizations/type/{type}":
    delete:
      tags:
        - Дополнительные операции
      operationId: deleteOneOrganizationByType
      summary: Удалить одну организацию заданного типа
      description: 'Выбирает любую одну организацию с указанным type. Если у выбранной организации есть сотрудники, возвращает 409 без удаления. Проверка и удаление атомарны. Не повторяйте запрос автоматически: следующий запрос может выбрать другую организацию.'
      parameters:
        - "$ref": "#/components/parameters/OrganizationTypePath"
      responses:
        '204':
          description: Организация удалена
        "400":
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                invalid_type:
                  $ref: "#/components/examples/invalid_type"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
        '404':
          "$ref": "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        '409':
          "$ref": "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/organizations/count":
    get:
      tags:
        - Дополнительные операции
      operationId: countOrganizationsByTypeGreaterThan
      summary: Посчитать организации с большим type
      description: Порядок типов совпадает с порядком значений enum.
      parameters:
        - name: typeGreaterThan
          in: query
          required: true
          description: Посчитать организации, чей type строго больше указанного значения в порядке enum. Значения null исключаются.
          schema:
            $ref: "#/components/schemas/OrganizationType"
      responses:
        '200':
          "$ref": "#/components/responses/CountResult"
        '400':
          description: "Неверные path/query-параметры, пропущенный обязательный query-параметр или неожиданное тело. details указывает поля и причины. Неизвестный путь или отсутствующий сегмент пути не совпадает с маршрутом и возвращает 404."
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownQueryParameter:
                  $ref: "#/components/examples/unknownQueryParameter"
                unexpectedBody:
                  $ref: "#/components/examples/unexpectedBody"
                invalid_typeGreaterThan:
                  $ref: "#/components/examples/invalid_typeGreaterThan"
                missing_typeGreaterThan:
                  $ref: "#/components/examples/missing_typeGreaterThan"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  schemas:
    EmployeeWrite:
      type: object
      description: Имя и принадлежность сотрудника. Отсутствующий organizationId означает отсутствие работодателя; при PUT снимает прежнее назначение. Несуществующий organizationId возвращает 404.
      additionalProperties: false
      required:
        - name
      xml:
        name: employee
      properties:
        name:
          type: string
          minLength: 1
        organizationId:
          "$ref": "#/components/schemas/PositiveId"
    Employee:
      type: object
      description: Сотрудник с глобально уникальным сгенерированным ID. organizationId отсутствует у сотрудника без работодателя. Сотрудник принадлежит не более чем одной организации.
      required:
        - id
        - name
      xml:
        name: employee
      properties:
        id:
          "$ref": "#/components/schemas/PositiveId"
        name:
          type: string
          minLength: 1
        organizationId:
          "$ref": "#/components/schemas/PositiveId"
    EmployeeList:
      type: array
      xml:
        name: employees
        wrapped: true
      items:
        "$ref": "#/components/schemas/Employee"
    PositiveId:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
    LocalDate:
      type: string
      format: date
      pattern: "^(?!0000)\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
    AnnualTurnover:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      maximum: 1.7976931348623157e+308
    OrganizationType:
      type: string
      enum:
        - PUBLIC
        - GOVERNMENT
        - TRUST
        - PRIVATE_LIMITED_COMPANY
    Coordinates:
      type: object
      required:
        - x
        - y
      xml:
        name: coordinates
      properties:
        x:
          type: integer
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        y:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
      additionalProperties: false
    Location:
      type: object
      required:
        - x
        - y
        - name
      xml:
        name: town
      properties:
        x:
          type: integer
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        y:
          type: integer
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        name:
          type: string
      additionalProperties: false
    Address:
      type: object
      required:
        - zipCode
      xml:
        name: officialAddress
      properties:
        zipCode:
          type: string
          maxLength: 18
        town:
          "$ref": "#/components/schemas/Location"
      additionalProperties: false
    OrganizationWrite:
      type: object
      required:
        - name
        - coordinates
      additionalProperties: false
      xml:
        name: organization
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          "$ref": "#/components/schemas/Coordinates"
        annualTurnover:
          "$ref": "#/components/schemas/AnnualTurnover"
        type:
          "$ref": "#/components/schemas/OrganizationType"
        officialAddress:
          "$ref": "#/components/schemas/Address"
    Organization:
      type: object
      required:
        - id
        - name
        - coordinates
        - creationDate
        - employees
      xml:
        name: organization
      properties:
        employees:
          type: array
          readOnly: true
          description: Все сотрудники с organizationId этой организации, упорядоченные по ID. Всегда присутствует; пустой список записывается как <employees/>. Изменяется через API сотрудников.
          xml:
            name: employees
            wrapped: true
          items:
            "$ref": "#/components/schemas/Employee"
        id:
          "$ref": "#/components/schemas/PositiveId"
        name:
          type: string
          minLength: 1
        coordinates:
          "$ref": "#/components/schemas/Coordinates"
        creationDate:
          "$ref": "#/components/schemas/LocalDate"
        annualTurnover:
          "$ref": "#/components/schemas/AnnualTurnover"
        type:
          "$ref": "#/components/schemas/OrganizationType"
        officialAddress:
          "$ref": "#/components/schemas/Address"
    OrganizationList:
      type: array
      xml:
        name: organizations
        wrapped: true
      items:
        "$ref": "#/components/schemas/Organization"
    Count:
      type: object
      required:
        - count
      xml:
        name: countResult
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      description: "Единый XML-формат ошибок обоих сервисов. status совпадает с HTTP-кодом; code — стабильный код ошибки; message — понятное описание. details всегда присутствует: все независимо обнаруженные нарушения для 400/422, пустой список для ошибок без привязки к полю. Не включайте стеки вызовов и внутренние сообщения зависимостей."
      required:
        - status
        - code
        - message
        - details
      xml:
        name: error
      properties:
        status:
          type: integer
          enum:
            - 400
            - 404
            - 406
            - 409
            - 415
            - 422
            - 500
            - 502
            - 503
            - 504
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: array
          xml:
            name: details
            wrapped: true
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      description: Причина ошибки конкретного поля. location указывает источник; field — имя поля, вложенный путь через точку или индекс с нуля (sort[1]). Для неразбираемого тела используется $. code стабилен для программной обработки; message объясняет нарушенное правило.
      required:
        - location
        - field
        - code
        - message
      xml:
        name: detail
      properties:
        location:
          type: string
          enum:
            - path
            - query
            - header
            - body
        field:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      description: ID сотрудника
      schema:
        "$ref": "#/components/schemas/PositiveId"
    EmployeeSort:
      name: sort
      in: query
      style: form
      explode: false
      description: "Поля через запятую, регистр учитывается. Единственный ведущий минус означает убывание; плюс, двойной минус, пробелы и пустые элементы недопустимы. Поле можно указать только один раз независимо от направления: name,name и name,-name возвращают 400 INVALID_SORT с индексом sort[n] и кодом DUPLICATE_SORT или CONFLICTING_SORT. Неизвестные поля возвращают UNKNOWN_FIELD; неверный формат — INVALID_FORMAT. Разрешены только значения enum. При отсутствии sort используется id; null идут последними, ID по возрастанию завершает сортировку, если он ещё не указан явно."
      schema:
        type: array
        uniqueItems: true
        default:
          - id
        items:
          type: string
          enum:
            - id
            - "-id"
            - name
            - "-name"
            - organizationId
            - "-organizationId"
        minItems: 1
    EmployeeFilter:
      name: filter
      in: query
      style: form
      explode: false
      description: Фильтры поле:оператор:значение через запятую объединяются через И; имена полей и строковые значения регистрозависимы. Первые два двоеточия отделяют поле и оператор; оставшаяся часть — значение, в котором двоеточия разрешены. Запятые разделяют условия, | разделяет значения in; экранирование этих разделителей внутри значений не поддерживается. in требует непустого набора непустых типизированных значений. Числа и даты поддерживают eq, ne, gt, gte, lt, lte, in; строки — eq, ne, contains, startsWith, in; enum — eq, ne, gt, gte, lt, lte, in с порядком OrganizationType. isNull принимает только true или false и разрешён для необязательных полей или их потомков; для объектов разрешён только isNull. Обычные сравнения исключают отсутствующие значения. Пустое строковое значение разрешено только для полей, допускающих пустую строку; contains/startsWith требуют непустую строку. Даты проверяются как реальные календарные даты 0001-9999 в формате YYYY-MM-DD. Числа конечны и соответствуют типу/диапазону поля; значения annualTurnover строго положительны. Неизвестное поле, неподдерживаемый оператор, пустой фильтр, неверный синтаксис или типизированное значение возвращают 400 INVALID_FILTER с индексом filter[n]. Для неверного поля используется UNKNOWN_FIELD, оператора — UNKNOWN_OPERATOR, синтаксиса — INVALID_FORMAT, типа — INVALID_TYPE, диапазона — OUT_OF_RANGE. Фильтрация массивов employees и их элементов не поддерживается. Для сотрудников разрешены только id, name и organizationId; isNull доступен только для organizationId.
      schema:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      example:
        - organizationId:eq:1
    OrganizationId:
      name: id
      in: path
      required: true
      description: ID организации
      schema:
        "$ref": "#/components/schemas/PositiveId"
    OrganizationTypePath:
      name: type
      in: path
      required: true
      description: Тип организации
      schema:
        "$ref": "#/components/schemas/OrganizationType"
    Page:
      name: page
      in: query
      description: Десятичное целое число >= 1, по умолчанию 1 только при отсутствии параметра. Пустое, дробное, повторяющееся или выходящее за диапазон значение возвращает 400 с полем page.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: Десятичное целое число от 1 до 100 включительно, по умолчанию 20 только при отсутствии параметра. Пустое, дробное, повторяющееся или выходящее за диапазон значение возвращает 400 с полем size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      style: form
      explode: false
      description: "Поля через запятую, регистр учитывается. Единственный ведущий минус означает убывание; плюс, двойной минус, пробелы и пустые элементы недопустимы. Поле можно указать только один раз независимо от направления: name,name и name,-name возвращают 400 INVALID_SORT с индексом sort[n] и кодом DUPLICATE_SORT или CONFLICTING_SORT. Неизвестные поля возвращают UNKNOWN_FIELD; неверный формат — INVALID_FORMAT. Разрешены только значения enum. При отсутствии sort используется id; null идут последними, ID по возрастанию завершает сортировку, если он ещё не указан явно."
      schema:
        type: array
        uniqueItems: true
        default:
          - id
        items:
          type: string
          enum:
            - id
            - "-id"
            - name
            - "-name"
            - coordinates.x
            - "-coordinates.x"
            - coordinates.y
            - "-coordinates.y"
            - creationDate
            - "-creationDate"
            - annualTurnover
            - "-annualTurnover"
            - type
            - "-type"
            - officialAddress.zipCode
            - "-officialAddress.zipCode"
            - officialAddress.town.x
            - "-officialAddress.town.x"
            - officialAddress.town.y
            - "-officialAddress.town.y"
            - officialAddress.town.name
            - "-officialAddress.town.name"
        minItems: 1
    Filter:
      name: filter
      in: query
      style: form
      explode: false
      description: |-
        Фильтры поле:оператор:значение через запятую объединяются через И; имена полей и строковые значения регистрозависимы. Первые два двоеточия отделяют поле и оператор; оставшаяся часть — значение, в котором двоеточия разрешены. Запятые разделяют условия, | разделяет значения in; экранирование этих разделителей внутри значений не поддерживается. in требует непустого набора непустых типизированных значений. Числа и даты поддерживают eq, ne, gt, gte, lt, lte, in; строки — eq, ne, contains, startsWith, in; enum — eq, ne, gt, gte, lt, lte, in с порядком OrganizationType. isNull принимает только true или false и разрешён для необязательных полей или их потомков; для объектов разрешён только isNull. Обычные сравнения исключают отсутствующие значения. Пустое строковое значение разрешено только для полей, допускающих пустую строку; contains/startsWith требуют непустую строку. Даты проверяются как реальные календарные даты 0001-9999 в формате YYYY-MM-DD. Числа конечны и соответствуют типу/диапазону поля; значения annualTurnover строго положительны. Неизвестное поле, неподдерживаемый оператор, пустой фильтр, неверный синтаксис или типизированное значение возвращают 400 INVALID_FILTER с индексом filter[n]. Для неверного поля используется UNKNOWN_FIELD, оператора — UNKNOWN_OPERATOR, синтаксиса — INVALID_FORMAT, типа — INVALID_TYPE, диапазона — OUT_OF_RANGE. Фильтрация массивов employees и их элементов не поддерживается. Для организаций разрешены скалярные поля из enum Sort без минуса, а также isNull для annualTurnover, type, officialAddress, officialAddress.town и их скалярных потомков.
      schema:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
      example:
        - name:contains:ООО
        - annualTurnover:gte:1000
        - annualTurnover:lte:5000
        - type:in:PUBLIC|TRUST
  requestBodies:
    EmployeeInput:
      required: true
      description: Полное новое состояние изменяемых полей сотрудника. ID генерируется сервером и не передаётся в теле.
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/EmployeeWrite"
          examples:
            assigned:
              value: "<employee><name>Иван Иванов</name><organizationId>1</organizationId></employee>"
            unassigned:
              value: "<employee><name>Иван Иванов</name></employee>"
    CreateOrganizationInput:
      required: true
      description: Данные новой организации
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/OrganizationWrite"
          examples:
            example:
              value: |
                <organization>
                  <name>Ромашка</name>
                  <coordinates>
                    <x>10</x>
                    <y>20</y>
                  </coordinates>
                  <annualTurnover>1500.5</annualTurnover>
                  <type>PUBLIC</type>
                </organization>
    UpdateOrganizationInput:
      required: true
      description: Новые значения полей организации
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/OrganizationWrite"
          examples:
            example:
              value: |
                <organization>
                  <name>Новое название</name>
                  <coordinates>
                    <x>15</x>
                    <y>25</y>
                  </coordinates>
                  <annualTurnover>2000</annualTurnover>
                  <type>PRIVATE_LIMITED_COMPANY</type>
                </organization>
  responses:
    EmployeeCreated:
      description: Сотрудник создан
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/Employee"
    EmployeeResult:
      description: Сотрудник
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/Employee"
    OrganizationCreated:
      description: Организация создана
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/Organization"
    OrganizationResult:
      description: Организация
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/Organization"
    OrganizationPage:
      description: Страница организаций
      headers:
        X-Total-Count:
          description: Общее количество
          schema:
            type: integer
            minimum: 0
        X-Page:
          description: Номер страницы
          schema:
            type: integer
            minimum: 1
        X-Page-Size:
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/OrganizationList"
    EmployeePage:
      description: Страница сотрудников
      headers:
        X-Total-Count:
          description: Общее количество
          schema:
            type: integer
            minimum: 0
        X-Page:
          description: Номер страницы
          schema:
            type: integer
            minimum: 1
        X-Page-Size:
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/EmployeeList"
    CountResult:
      description: Количество
      content:
        application/xml:
          schema:
            "$ref": "#/components/schemas/Count"
    NotFound:
      description: Организация, сотрудник или организация назначения не найдены. Корректный по формату, но неизвестный ID возвращает 404; неверный формат ID — 400.
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingOrganization:
              $ref: "#/components/examples/missingOrganization"
    Conflict:
      description: Текущее состояние препятствует операции. При поглощении ранее выполненные переносы могут сохраниться.
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            nonemptyOrganization:
              $ref: "#/components/examples/nonemptyOrganization"
    ValidationError:
      description: "XML корректен синтаксически, но нарушает схему тела: обязательность, тип, диапазон, enum, неизвестное/повторяющееся или управляемое сервером поле. details перечисляет все независимо обнаруженные нарушения; изменения не применяются."
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            multipleViolations:
              $ref: "#/components/examples/multipleViolations"
            invalidNestedField:
              $ref: "#/components/examples/invalidNestedField"
            invalidEnum:
              $ref: "#/components/examples/invalidEnum"
            readOnlyField:
              $ref: "#/components/examples/readOnlyField"
            unknownElement:
              $ref: "#/components/examples/unknownElement"
            duplicateElement:
              $ref: "#/components/examples/duplicateElement"
            wrongRoot:
              $ref: "#/components/examples/wrongRoot"
    NotAcceptable:
      description: Accept не допускает application/xml. Тело ошибки описано в XML; если клиент исключил XML, сервер может вернуть 406 без тела.
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unsupportedAccept:
              $ref: "#/components/examples/unsupportedAccept"
    UnsupportedMediaType:
      description: Тип или кодирование тела запроса не поддерживается. Поддерживается application/xml без Content-Encoding или с identity.
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unsupportedContentType:
              $ref: "#/components/examples/unsupportedContentType"
            unsupportedContentEncoding:
              $ref: "#/components/examples/unsupportedContentEncoding"
    InternalServerError:
      description: Непредвиденная внутренняя ошибка. Внутренние сообщения и стеки не раскрываются. Для изменений результат может быть неизвестен, а поглощение может быть выполнено частично; сверяйте состояние перед продолжением.
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internalError:
              $ref: "#/components/examples/internalError"
    ServiceUnavailable:
      description: "Сервис временно не может обработать запрос: перегрузка, обслуживание или временная недоступность необходимой зависимости. Менеджер сохраняет upstream 503 как 503. Retry-After указывается только при известной задержке. Изменения могли примениться, а поглощение — выполниться частично; Retry-After не разрешает автоматически повторять изменения."
      headers:
        Retry-After:
          description: Необязательная известная задержка в секундах до следующей попытки. Для изменений сначала сверяйте состояние; автоматический повтор не гарантированно безопасен.
          schema:
            type: integer
            minimum: 0
          example: 30
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            serviceUnavailable:
              $ref: "#/components/examples/serviceUnavailable"
            dependencyUnavailable:
              $ref: "#/components/examples/dependencyUnavailable"
    EmployeeValidationError:
      description: "XML корректен синтаксически, но нарушает схему тела: обязательность, тип, диапазон, enum, неизвестное/повторяющееся или управляемое сервером поле. details перечисляет все независимо обнаруженные нарушения; изменения не применяются."
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidEmployee:
              $ref: "#/components/examples/invalidEmployee"
            readOnlyField:
              $ref: "#/components/examples/readOnlyField"
            unknownElement:
              $ref: "#/components/examples/unknownElement"
            duplicateElement:
              $ref: "#/components/examples/duplicateElement"
            wrongRoot:
              $ref: "#/components/examples/wrongRoot2"
  examples:
    unknownQueryParameter:
      summary: Неизвестный параметр запроса.
      value: |
        <error>
          <status>400</status>
          <code>INVALID_REQUEST</code>
          <message>Неизвестный параметр запроса.</message>
          <details>
            <detail>
              <location>query</location>
              <field>unexpected</field>
              <code>UNKNOWN_FIELD</code>
              <message>Параметр unexpected не поддерживается этим endpoint; удалите его.</message>
            </detail>
          </details>
        </error>
    missingBody:
      summary: Отсутствует обязательное XML-тело.
      value: |
        <error>
          <status>400</status>
          <code>MISSING_BODY</code>
          <message>Отсутствует обязательное XML-тело.</message>
          <details>
            <detail>
              <location>body</location>
              <field>$</field>
              <code>REQUIRED</code>
              <message>Передайте XML-тело с корневым элементом organization.</message>
            </detail>
          </details>
        </error>
    malformedXml:
      summary: XML-тело не удалось разобрать.
      value: |
        <error>
          <status>400</status>
          <code>MALFORMED_XML</code>
          <message>XML-тело не удалось разобрать.</message>
          <details>
            <detail>
              <location>body</location>
              <field>$</field>
              <code>INVALID_FORMAT</code>
              <message>XML должен содержать один корректно закрытый корневой элемент.</message>
            </detail>
          </details>
        </error>
    unknownSortField:
      summary: Неизвестное поле сортировки.
      value: |
        <error>
          <status>400</status>
          <code>INVALID_SORT</code>
          <message>Неизвестное поле сортировки.</message>
          <details>
            <detail>
              <location>query</location>
              <field>sort[1]</field>
              <code>UNKNOWN_FIELD</code>
              <message>Поле salary в sort=name,salary не поддерживается; используйте поля из enum параметра sort.</message>
            </detail>
          </details>
        </error>
    malformedSort:
      summary: Некорректное направление сортировки.
      value: |
        <error>
