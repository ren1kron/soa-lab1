openapi: 3.0.3
info:
  title: Organization Services
  version: 1.0.0
  description: |
    XML contracts for the Organization Collection service and the Organization Manager.

    Operation parameters belong in the URL. Organization representations for POST and
    PUT are application/xml request bodies. Responses with a body are application/xml;
    send Accept: application/xml (or */*). There is no authentication in this contract.

    IDs and creation dates are generated by the collection service and immutable.
    Unknown XML elements, duplicate singular elements, and client-supplied generated
    fields are rejected with 422. Malformed XML is 400. Empty optional objects are not
    null: omit officialAddress or town to represent null. xsi:nil is not supported.

    Employee headcounts are separate resources and do not extend Organization.
    Each newly created organization starts with headcount zero. Deleting an
    organization also deletes its headcount. PUT preserves its headcount.
    Acquisition and hiring are atomic in the collection service. The manager calls
    those APIs and does not maintain a second copy of employee data.

    Manager calls are synchronous. Domain errors are forwarded with their status
    and XML error body; connection/upstream failures use 502 and timeouts use 504.
    A timeout does not prove that a mutation failed. POST hiring and acquisition
    must not be automatically retried, because this contract has no idempotency key.
servers:
  - url: '{baseUrl}'
    description: Organization Collection service (configure the actual API URL)
    variables:
      baseUrl:
        default: http://localhost:8080
        description: Absolute service URL without a trailing slash; may include a context path.
tags:
  - name: Organizations
    description: Collection CRUD, selection, ordering and pagination.
  - name: Collection Operations
    description: Dedicated URLs for operations on selected organizations.
  - name: Workforce
    description: Collection-service headcounts and atomic acquisition, called by the manager.
  - name: Organization Manager
    description: The second service, exposed under /orgmanager.
paths:
  /organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Add an organization
      description: |
        Create an organization from its mutable fields. Generate a unique positive ID
        and a local creation timestamp, and initialize its separate headcount to zero.
        Duplicate organization names are allowed. Return the created representation
        and its resource URL in Location. Client-supplied id or creationDate is 422.
      requestBody:
        $ref: '#/components/requestBodies/OrganizationInput'
      responses:
        '201':
          description: Organization created.
          headers:
            Location:
              description: URL of the created organization resource.
              schema:
                type: string
              example: /organizations/1
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                created:
                  $ref: '#/components/examples/OrganizationExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List organizations
      description: |
        Filter first, sort second, and paginate last. Every scalar field can be
        filtered by equality using its exact dotted query name. All filters are
        combined with AND; strings compare case-sensitively without trimming or
        substring matching. Query values must be URL encoded. Missing filters impose
        no condition. Empty zipCode and officialAddress.town.name filters match empty
        strings. Filters on a child of a null object do not match that organization.

        officialAddress.isNull and officialAddress.town.isNull test nullable objects;
        a missing officialAddress also means its town is null. Contradictory filters
        produce an empty result. Example:
        ?type=PUBLIC&coordinates.y=417&officialAddress.town.name=Paris&sort=name,-annualTurnover&page=1&size=20

        Sorting accepts any scalar field path, uses the supplied priority order,
        and appends id ascending unless id is already present. Defaults to id ascending.
        Strings use case-sensitive Unicode code-point order, enum values use declaration
        order, timestamps use local chronological order, and nulls sort last in either
        direction. Page numbering is one-based. A page beyond the result set is 200
        with <organizations/>. X-Total-Count counts matches before pagination.
        Pagination is stable for unchanged data, not a snapshot across requests.

        Unknown query names, duplicate parameters, invalid typed filter values,
        unknown sort fields, and repeated sort fields are 400.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/FilterId'
        - $ref: '#/components/parameters/FilterName'
        - $ref: '#/components/parameters/FilterCoordinatesX'
        - $ref: '#/components/parameters/FilterCoordinatesY'
        - $ref: '#/components/parameters/FilterCreationDate'
        - $ref: '#/components/parameters/FilterAnnualTurnover'
        - $ref: '#/components/parameters/FilterType'
        - $ref: '#/components/parameters/FilterZipCode'
        - $ref: '#/components/parameters/FilterTownX'
        - $ref: '#/components/parameters/FilterTownY'
        - $ref: '#/components/parameters/FilterTownName'
        - $ref: '#/components/parameters/FilterAddressIsNull'
        - $ref: '#/components/parameters/FilterTownIsNull'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Retrieve an organization by ID
      description: Return the current organization representation, or 404 if its ID does not exist.
      responses:
        '200':
          $ref: '#/components/responses/OrganizationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Organizations]
      operationId: replaceOrganization
      summary: Replace an organization
      description: |
        Replace all mutable fields of an existing organization. Omitted officialAddress
        becomes null; omitted town becomes null. Preserve id, creationDate and headcount.
        This is full replacement, not a partial update or upsert. A missing ID is 404.
        Return the updated representation. Invalid input leaves the organization unchanged.
      requestBody:
        $ref: '#/components/requestBodies/OrganizationInput'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Delete an organization by ID
      description: |
        Delete the organization and its separate headcount atomically. A missing ID,
        including a repeated deletion, returns 404. Success has no response body.
      responses:
        '204':
          description: Organization and its headcount deleted. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /organizations/by-type/{type}:
    delete:
      tags: [Collection Operations]
      operationId: deleteOneOrganizationByType
      summary: Delete one arbitrary organization of a type
      description: |
        Atomically select and delete exactly one organization whose type equals the
        supplied value, including its headcount. Selection is unspecified. Return 404
        if no match exists. Repeating this request may delete a different organization;
        this selection operation must not be automatically retried.
      parameters:
        - $ref: '#/components/parameters/OrganizationTypePath'
      responses:
        '204':
          description: One matching organization and its headcount deleted. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /organizations/count-by-type-greater-than/{type}:
    get:
      tags: [Collection Operations]
      operationId: countOrganizationsByTypeGreaterThan
      summary: Count organizations with a greater type
      description: |
        Return the number of organizations whose type is strictly greater than the
        specified type in Java declaration order:
        PUBLIC < GOVERNMENT < TRUST < PRIVATE_LIMITED_COMPANY.
        This is not alphabetical ordering. For PRIVATE_LIMITED_COMPANY the count is zero.
      parameters:
        - $ref: '#/components/parameters/OrganizationTypePath'
      responses:
        '200':
          description: Number of matching organizations, including zero.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CountResult'
              example: '<countResult><count>3</count></countResult>'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /organizations/by-annual-turnover-less-than/{annualTurnover}:
    get:
      tags: [Collection Operations]
      operationId: listOrganizationsByAnnualTurnoverLessThan
      summary: List organizations below an annual turnover
      description: |
        Return organizations with annualTurnover strictly below the threshold.
        The threshold is any Java int, including zero and negative values (which
        yield an empty result). Equality is excluded. Use the same sort semantics,
        default ordering and pagination as GET /organizations. X-Total-Count is the
        number of matches before pagination. No matches or a page beyond the results
        returns 200 with <organizations/>. Unknown/duplicate query parameters and
        invalid or repeated sort fields return 400.
      parameters:
        - name: annualTurnover
          in: path
          required: true
          description: Exclusive upper threshold; this is a comparison operand, not an organization field value.
          schema:
            type: integer
            format: int32
            minimum: -2147483648
            maximum: 2147483647
          example: 1000000
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /organizations/{id}/headcount:
    get:
      tags: [Workforce]
      operationId: getOrganizationHeadcount
      summary: Retrieve an organization's employee count
      description: |
        Return the current headcount stored separately from Organization. New
        organizations have zero employees. Employee identities are outside this contract.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          $ref: '#/components/responses/HeadcountResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /organizations/{id}/hires:
    post:
      tags: [Workforce]
      operationId: hireOrganizationEmployee
      summary: Hire one employee atomically
      description: |
        Increment the organization's separate headcount by exactly one and return
        the new count. No request body or employee details are required. Organization
        existence and the increment are checked in the same transaction; concurrent
        hires do not lose increments. Return 409 if the int64 count would overflow.
        Repeating a successful call hires another employee.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          $ref: '#/components/responses/HeadcountResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /organization-acquisitions:
    post:
      tags: [Workforce]
      operationId: acquireOrganization
      summary: Merge two organizations atomically
      description: |
        Acquire acquiredId into acquirerId. In one transaction, verify both exist,
        add their annual turnovers and headcounts, and delete the acquired organization
        and its headcount resource. Preserve the acquirer's id, name, coordinates,
        creationDate, type and officialAddress. Return the surviving organization,
        its resulting headcount, and the acquired ID. No employees are dismissed.

        IDs must differ (409); a missing organization is 404. Return 409 if the turnover
        sum exceeds 2147483647 or headcount exceeds 9223372036854775807. All failures
        leave both organizations and headcounts unchanged. Serialize overlapping hires,
        updates, deletions and acquisitions so no increment or field update is lost.
        A repeated successful acquisition normally returns 404 because acquiredId was deleted.
        No request body is required. This is a synchronous action; no persistent
        acquisition resource or polling endpoint is introduced.
      parameters:
        - name: acquirerId
          in: query
          required: true
          description: ID of the organization that survives the acquisition.
          schema:
            $ref: '#/components/schemas/PositiveId'
          example: 1
        - name: acquiredId
          in: query
          required: true
          description: ID of the organization whose turnover and employees are transferred before deletion.
          schema:
            $ref: '#/components/schemas/PositiveId'
          example: 2
      responses:
        '200':
          $ref: '#/components/responses/AcquisitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgmanager/hire/{id}:
    post:
      servers:
        - url: '{baseUrl}'
          description: Organization Manager service (configure the actual API URL)
          variables:
            baseUrl:
              default: http://localhost:8081
              description: Absolute manager service URL without /orgmanager or a trailing slash.
      tags: [Organization Manager]
      operationId: managerHireEmployee
      summary: Add an employee through the manager
      description: |
        Call POST /organizations/{id}/hires on the collection service once and return
        its updated headcount. No request body is required. The manager does not
        perform a separate read-and-write increment or keep its own headcount.
        Propagate 400, 404 and 409 domain errors; upstream server or connection failures
        are 502 and upstream timeouts are 504. Do not retry automatically: the upstream
        hire may have committed even if its response was lost.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          $ref: '#/components/responses/HeadcountResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /orgmanager/acquise/{acquirer-id}/{acquired-id}:
    post:
      servers:
        - url: '{baseUrl}'
          description: Organization Manager service (configure the actual API URL)
          variables:
            baseUrl:
              default: http://localhost:8081
              description: Absolute manager service URL without /orgmanager or a trailing slash.
      tags: [Organization Manager]
      operationId: managerAcquireOrganization
      summary: Acquire an organization without dismissing employees
      description: |
        Call POST /organization-acquisitions?acquirerId={acquirer-id}&acquiredId={acquired-id}
        on the collection service once. Return its acquisition result. The collection
        service atomically transfers all employees, sums annual turnovers, preserves
        the acquirer's other fields and deletes the acquired organization. The manager
        must not implement this using separate GET, PUT and DELETE calls.

        No request body is required. Propagate 400, 404 and 409 domain errors. Upstream
        server/connection failures are 502 and timeouts are 504; a timeout can occur
        after a committed acquisition, so no automatic retries are made.
        The spelling 'acquise' is retained as required by the assignment.
      parameters:
        - name: acquirer-id
          in: path
          required: true
          description: ID of the surviving organization.
          schema:
            $ref: '#/components/schemas/PositiveId'
          example: 1
        - name: acquired-id
          in: path
          required: true
          description: ID of the organization to merge and delete.
          schema:
            $ref: '#/components/schemas/PositiveId'
          example: 2
      responses:
        '200':
          $ref: '#/components/responses/AcquisitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  schemas:
    PositiveId:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
      description: Positive Java Long. Preserve all 64 bits when parsing or serializing.
      example: 1
    LocalDateTime:
      type: string
      format: local-date-time
      pattern: '^(?!0000)\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d{1,9})?$'
      description: |
        Valid ISO local calendar date and time, YYYY-MM-DDTHH:mm:ss with optional
        1-9 fractional second digits. No Z or UTC offset. This API uses years
        0001-9999. Generated using the collection service's configured local clock;
        all collection instances must use the same time zone. No timezone conversion
        is applied when comparing filter values. Calendar validity is also required.
      example: '2026-09-12T10:30:00'
    AnnualTurnover:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
      description: Positive annual turnover, represented by a Java int.
      example: 500000
    OrganizationType:
      type: string
      enum: [PUBLIC, GOVERNMENT, TRUST, PRIVATE_LIMITED_COMPANY]
      description: 'Ordered by declaration: PUBLIC < GOVERNMENT < TRUST < PRIVATE_LIMITED_COMPANY.'
      example: PUBLIC
    Coordinates:
      type: object
      additionalProperties: false
      required: [x, y]
      xml:
        name: coordinates
      properties:
        x:
          type: number
          format: float
          minimum: -3.4028234663852886e+38
          maximum: 3.4028234663852886e+38
          description: Finite IEEE-754 binary32 value. NaN and infinities are rejected.
          example: 12.5
        y:
          type: number
          format: float
          minimum: -3.4028234663852886e+38
          maximum: 417
          description: Finite IEEE-754 binary32 value no greater than 417.
          example: 417
    Location:
      type: object
      nullable: true
      additionalProperties: false
      required: [x, y, name]
      description: Optional town. In XML, omit town for null; when present, all its fields are required.
      xml:
        name: town
      properties:
        x:
          type: integer
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
          example: 10
        y:
          type: integer
          format: int64
          minimum: -9223372036854775808
          maximum: 9223372036854775807
          example: -20
        name:
          type: string
          description: Required and non-null; the empty string is allowed.
          example: Paris
    Address:
      type: object
      nullable: true
      additionalProperties: false
      required: [zipCode]
      description: Optional address. In XML, omit officialAddress for null; an empty zipCode element is valid.
      xml:
        name: officialAddress
      properties:
        zipCode:
          type: string
          maxLength: 18
          description: Required and non-null; the empty string is allowed. At most 18 characters.
          example: '75001'
        town:
          $ref: '#/components/schemas/Location'
    OrganizationWrite:
      type: object
      additionalProperties: false
      required: [name, coordinates, annualTurnover, type]
      description: |
        Mutable organization fields. id and creationDate must not be supplied.
        Both coordinates are required even though the Java fields are primitives;
        the API does not silently default missing numeric input to zero.
      xml:
        name: organization
      properties:
        name:
          type: string
          minLength: 1
          description: Non-null and nonempty. Whitespace is preserved and is not prohibited by the class constraints.
          example: Example Organization
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          $ref: '#/components/schemas/AnnualTurnover'
        type:
          $ref: '#/components/schemas/OrganizationType'
        officialAddress:
          $ref: '#/components/schemas/Address'
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, coordinates, creationDate, annualTurnover, type]
      description: Organization representation. IDs are globally unique within the collection and are never reused.
      xml:
        name: organization
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          readOnly: true
          description: Non-null, unique, positive ID generated by the service. Immutable.
          example: 1
        name:
          type: string
          minLength: 1
          example: Example Organization
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
          description: Non-null local creation timestamp generated by the service. Immutable.
        annualTurnover:
          $ref: '#/components/schemas/AnnualTurnover'
        type:
          $ref: '#/components/schemas/OrganizationType'
        officialAddress:
          $ref: '#/components/schemas/Address'
    OrganizationList:
      type: array
      description: XML array wrapped by organizations, containing zero or more organization elements.
      xml:
        name: organizations
        wrapped: true
      items:
        $ref: '#/components/schemas/Organization'
    NonNegativeCount:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      example: 3
    CountResult:
      type: object
      additionalProperties: false
      required: [count]
      xml:
        name: countResult
      properties:
        count:
          $ref: '#/components/schemas/NonNegativeCount'
    Headcount:
      type: object
      additionalProperties: false
      required: [organizationId, employeeCount]
      xml:
        name: headcount
      properties:
        organizationId:
          $ref: '#/components/schemas/PositiveId'
        employeeCount:
          $ref: '#/components/schemas/NonNegativeCount'
    Acquisition:
      type: object
      additionalProperties: false
      required: [organization, acquiredId, employeeCount]
      xml:
        name: acquisition
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        acquiredId:
          $ref: '#/components/schemas/PositiveId'
        employeeCount:
          $ref: '#/components/schemas/NonNegativeCount'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      xml:
        name: violation
      properties:
        field:
          type: string
          description: Dotted field path or URL parameter name.
          example: coordinates.y
        message:
          type: string
          example: Must be less than or equal to 417.
    Error:
      type: object
      additionalProperties: false
      required: [status, code, message]
      xml:
        name: error
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 422
        code:
          type: string
          enum: [BAD_REQUEST, NOT_FOUND, NOT_ACCEPTABLE, CONFLICT, UNSUPPORTED_MEDIA_TYPE, VALIDATION_ERROR, INTERNAL_ERROR, BAD_GATEWAY, GATEWAY_TIMEOUT]
          example: VALIDATION_ERROR
        message:
          type: string
          example: Organization violates integrity constraints.
        violations:
          type: array
          xml:
            name: violations
            wrapped: true
          items:
            $ref: '#/components/schemas/FieldError'
  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      description: Positive organization ID; invalid syntax or range is 400 and an absent organization is 404.
      schema:
        $ref: '#/components/schemas/PositiveId'
      example: 1
    OrganizationTypePath:
      name: type
      in: path
      required: true
      description: Case-sensitive enum constant. Unknown constants return 400.
      schema:
        $ref: '#/components/schemas/OrganizationType'
      example: PUBLIC
    Page:
      name: page
      in: query
      description: One-based page number. Beyond the last page returns an empty array with 200.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 1
      example: 1
    Size:
      name: size
      in: query
      description: Maximum number of organizations per page. Out-of-range values return 400.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    Sort:
      name: sort
      in: query
      style: form
      explode: false
      description: |
        Comma-separated field paths in priority order; prefix a field with - for
        descending order. No prefix means ascending. No whitespace, duplicate fields,
        or + prefix. Default id ascending; append id ascending if not supplied.
        Nulls always sort last. Example: name,-annualTurnover.
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        default: [id]
        items:
          type: string
          enum:
            - id
            - '-id'
            - name
            - '-name'
            - coordinates.x
            - '-coordinates.x'
            - coordinates.y
            - '-coordinates.y'
            - creationDate
            - '-creationDate'
            - annualTurnover
            - '-annualTurnover'
            - type
            - '-type'
            - officialAddress.zipCode
            - '-officialAddress.zipCode'
            - officialAddress.town.x
            - '-officialAddress.town.x'
            - officialAddress.town.y
            - '-officialAddress.town.y'
            - officialAddress.town.name
            - '-officialAddress.town.name'
      example: [name, '-annualTurnover']
    FilterId:
      name: id
      in: query
      description: Exact ID filter.
      schema:
        $ref: '#/components/schemas/PositiveId'
    FilterName:
      name: name
      in: query
      description: Exact, case-sensitive organization name filter.
      schema:
        type: string
        minLength: 1
    FilterCoordinatesX:
      name: coordinates.x
      in: query
      description: Exact coordinate x filter, compared after conversion to finite binary32.
      schema:
        type: number
        format: float
        minimum: -3.4028234663852886e+38
        maximum: 3.4028234663852886e+38
    FilterCoordinatesY:
      name: coordinates.y
      in: query
      description: Exact coordinate y filter, compared after conversion to finite binary32.
      schema:
        type: number
        format: float
        minimum: -3.4028234663852886e+38
        maximum: 417
    FilterCreationDate:
      name: creationDate
      in: query
      description: Exact local timestamp filter; equivalent fractional-second precision compares equal.
      schema:
        $ref: '#/components/schemas/LocalDateTime'
    FilterAnnualTurnover:
      name: annualTurnover
      in: query
      description: Exact positive annual turnover filter.
      schema:
        $ref: '#/components/schemas/AnnualTurnover'
    FilterType:
      name: type
      in: query
      description: Exact, case-sensitive enum filter.
      schema:
        $ref: '#/components/schemas/OrganizationType'
    FilterZipCode:
      name: officialAddress.zipCode
      in: query
      allowEmptyValue: true
      description: Exact ZIP code filter. An explicitly empty value matches an empty ZIP code, not a null address.
      schema:
        type: string
        maxLength: 18
    FilterTownX:
      name: officialAddress.town.x
      in: query
      description: Exact town x filter. Does not match a null town.
      schema:
        type: integer
        format: int64
        minimum: -9223372036854775808
        maximum: 9223372036854775807
    FilterTownY:
      name: officialAddress.town.y
      in: query
      description: Exact town y filter. Does not match a null town.
      schema:
        type: integer
        format: int64
        minimum: -9223372036854775808
        maximum: 9223372036854775807
    FilterTownName:
      name: officialAddress.town.name
      in: query
      allowEmptyValue: true
      description: Exact, case-sensitive town name filter; the empty string is valid and does not match a null town.
      schema:
        type: string
    FilterAddressIsNull:
      name: officialAddress.isNull
      in: query
      description: true matches null addresses; false matches present addresses. Omit to impose no condition.
      schema:
        type: boolean
    FilterTownIsNull:
      name: officialAddress.town.isNull
      in: query
      description: true matches a null town or null address; false requires a present town. Omit for no condition.
      schema:
        type: boolean
  requestBodies:
    OrganizationInput:
      required: true
      description: Complete mutable organization representation in XML. Generated fields must be absent.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/OrganizationWrite'
          examples:
            complete:
              summary: Organization with address and town
              value: |
                <organization>
                  <name>Example Organization</name>
                  <coordinates><x>12.5</x><y>417</y></coordinates>
                  <annualTurnover>500000</annualTurnover>
                  <type>PUBLIC</type>
                  <officialAddress>
                    <zipCode>75001</zipCode>
                    <town><x>10</x><y>-20</y><name>Paris</name></town>
                  </officialAddress>
                </organization>
            withoutAddress:
              summary: Null address represented by omission
              value: |
                <organization>
                  <name>Independent Trust</name>
                  <coordinates><x>-3.5</x><y>0</y></coordinates>
                  <annualTurnover>1</annualTurnover>
                  <type>TRUST</type>
                </organization>
            emptyZipCode:
              summary: Empty ZIP code and null town are valid
              value: |
                <organization>
                  <name>Local Company</name>
                  <coordinates><x>0</x><y>0</y></coordinates>
                  <annualTurnover>100</annualTurnover>
                  <type>PRIVATE_LIMITED_COMPANY</type>
                  <officialAddress><zipCode/></officialAddress>
                </organization>
  responses:
    OrganizationResult:
      description: Current organization representation.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Organization'
          examples:
            organization:
              $ref: '#/components/examples/OrganizationExample'
    OrganizationPage:
      description: A page of matching organizations; an empty page is successful.
      headers:
        X-Total-Count:
          description: Required. Total matching organizations before pagination.
          schema:
            $ref: '#/components/schemas/NonNegativeCount'
          example: 1
        X-Page:
          description: Required. Requested or default one-based page number.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
          example: 1
        X-Page-Size:
          description: Required. Requested or default page size.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          example: 20
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/OrganizationList'
          examples:
            page:
              summary: One matching organization
              value: |
                <organizations>
                  <organization>
                    <id>1</id><name>Example Organization</name>
                    <coordinates><x>12.5</x><y>417</y></coordinates>
                    <creationDate>2026-09-12T10:30:00</creationDate>
                    <annualTurnover>500000</annualTurnover><type>PUBLIC</type>
                    <officialAddress><zipCode>75001</zipCode></officialAddress>
                  </organization>
                </organizations>
            empty:
              summary: No matches or a page beyond the result set
              value: '<organizations/>'
    HeadcountResult:
      description: Employee count after the operation, stored separately from Organization.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Headcount'
          example: '<headcount><organizationId>1</organizationId><employeeCount>3</employeeCount></headcount>'
    AcquisitionResult:
      description: Completed acquisition with the surviving organization and combined headcount.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Acquisition'
          example: |
            <acquisition>
              <organization>
                <id>1</id><name>Example Organization</name>
                <coordinates><x>12.5</x><y>417</y></coordinates>
                <creationDate>2026-09-12T10:30:00</creationDate>
                <annualTurnover>750000</annualTurnover><type>PUBLIC</type>
                <officialAddress><zipCode>75001</zipCode></officialAddress>
              </organization>
              <acquiredId>2</acquiredId>
              <employeeCount>8</employeeCount>
            </acquisition>
    BadRequest:
      description: Malformed XML, missing URL parameter, invalid URL parameter syntax/range, or unsupported/duplicate query parameter.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: '<error><status>400</status><code>BAD_REQUEST</code><message>page must be an integer greater than or equal to 1.</message></error>'
    NotFound:
      description: Organization not found, or no organization matches the delete-by-type selection.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: '<error><status>404</status><code>NOT_FOUND</code><message>Organization 42 does not exist.</message></error>'
    NotAcceptable:
      description: The Accept header excludes application/xml. The error representation itself is application/xml.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: '<error><status>406</status><code>NOT_ACCEPTABLE</code><message>Only application/xml responses are available.</message></error>'
    Conflict:
      description: Acquisition IDs are equal, or the operation would overflow turnover or headcount. No changes were committed.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            selfAcquisition:
              value: '<error><status>409</status><code>CONFLICT</code><message>An organization cannot acquire itself.</message></error>'
            overflow:
              value: '<error><status>409</status><code>CONFLICT</code><message>The operation would exceed a numeric field limit.</message></error>'
    UnsupportedMediaType:
      description: A create/update body has a missing or unsupported Content-Type. Use application/xml with optional charset=utf-8.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: '<error><status>415</status><code>UNSUPPORTED_MEDIA_TYPE</code><message>Request body must use application/xml.</message></error>'
    ValidationError:
      description: Well-formed XML violates a field constraint, includes unknown/generated fields, or omits required organization data.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: |
            <error>
              <status>422</status><code>VALIDATION_ERROR</code>
              <message>Organization violates integrity constraints.</message>
              <violations>
                <violation><field>annualTurnover</field><message>Must be greater than 0.</message></violation>
                <violation><field>coordinates.y</field><message>Must be less than or equal to 417.</message></violation>
              </violations>
            </error>
    InternalError:
      description: Unexpected service failure; the response does not expose stack traces or internal connection details.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: '<error><status>500</status><code>INTERNAL_ERROR</code><message>Unexpected service error.</message></error>'
    BadGateway:
      description: The collection service could not be reached, returned an unexpected response or failed with a server error. Mutation outcome may be unknown.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: '<error><status>502</status><code>BAD_GATEWAY</code><message>Collection service request failed.</message></error>'
    GatewayTimeout:
      description: The collection service did not respond in time. The operation may already have committed; no automatic retry is performed.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
          example: '<error><status>504</status><code>GATEWAY_TIMEOUT</code><message>Collection service response timed out; mutation outcome is unknown.</message></error>'
  examples:
    OrganizationExample:
      summary: Organization with generated ID and creation date
      value: |
        <organization>
          <id>1</id>
          <name>Example Organization</name>
          <coordinates><x>12.5</x><y>417</y></coordinates>
          <creationDate>2026-09-12T10:30:00</creationDate>
          <annualTurnover>500000</annualTurnover>
          <type>PUBLIC</type>
          <officialAddress>
            <zipCode>75001</zipCode>
            <town><x>10</x><y>-20</y><name>Paris</name></town>
          </officialAddress>
        </organization>
